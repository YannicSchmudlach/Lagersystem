services:
  backend:
    build: .
    depends_on:
      - db
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lagersystem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: lagersystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
