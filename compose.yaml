  backend:
    #container_name: lager-api
    depends_on:
      - db
    image: lager:0.0.1
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lagersystem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  db:
    container_name: postgres-sql-lager
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: lagersystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
